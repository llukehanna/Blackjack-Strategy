name: iOS

on:
  push:
    branches: [main, main-8v0ds1]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Engine tests (BJSCore)
        working-directory: BJSCore
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if "iOS" in k), reverse=True)
          for runtime in ios:
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          sys.exit("no iPhone simulator")')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      - name: Build and test app
        run: |
          set -o pipefail
          xcodebuild test -project BJS.xcodeproj -scheme BJS \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO | tail -200
