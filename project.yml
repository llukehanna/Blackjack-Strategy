name: BJS
options:
  bundleIdPrefix: com.bjs
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.3"
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "6.2"
    SWIFT_STRICT_CONCURRENCY: complete
    OTHER_SWIFT_FLAGS: "-enable-upcoming-feature DefaultIsolationMainActor"
targets:
  BJS:
    type: application
    platform: iOS
    sources: [BJS]
    dependencies:
      - package: BJSCore
    scheme:
      testTargets:
        - BJSTests
        - BJSUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.bjs.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: BJS
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  BJSTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BJSTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: BJS
  BJSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BJSUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: BJS
packages:
  BJSCore:
    path: ./BJSCore
