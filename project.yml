name: BJS
options:
  bundleIdPrefix: com.bjs
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.3"
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "6.2"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  BJS:
    type: application
    platform: iOS
    sources: [BJS]
    dependencies:
      - package: BJSCore
    scheme:
      testTargets:
        - BJSTests
        - BJSUITests
    info:
      # XcodeGen writes this plist on `xcodegen generate` (gitignored); Xcode merges it with
      # the generated keys. UILaunchScreen is what stops iOS running the app letterboxed in
      # legacy 320x480 mode; UIDesignRequiresCompatibility opts out of Liquid Glass (Step 2
      # Decision 15). "INFOPLIST_VALUES" used before is not an Xcode setting and did nothing.
      path: BJS/Info.plist
      properties:
        CFBundleDisplayName: BJS
        UILaunchScreen: {}
        UIDesignRequiresCompatibility: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.bjs.app
  BJSTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BJSTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: BJS
  BJSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BJSUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BJS
    dependencies:
      - target: BJS
packages:
  BJSCore:
    path: ./BJSCore
